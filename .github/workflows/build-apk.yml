name: Build APK

# Builds the Android app in the cloud and publishes the APK as a downloadable
# artifact. No Android Studio, no local SDK, no Gradle on your machine.
#
# Run it from the "Actions" tab -> "Build APK" -> "Run workflow".
#
# Note: we deliberately do NOT use android-actions/setup-android. The runner
# image already contains the SDK (with accepted licences), and that action's
# `sdkmanager --update` step is a common source of "failed with exit code 1".
# We use the preinstalled SDK and only install a package if it is missing.

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The 22.04 image ships the Android SDK 34 that this project targets.
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Catches the most common setup mistake (the zip uploaded instead of the
      # folder, or android/ nested one level deep) with a readable message.
      - name: Check project layout
        working-directory: .
        run: |
          if [ ! -f android/settings.gradle.kts ]; then
            echo "::error::android/settings.gradle.kts not found. The repository root must contain the 'android' folder itself."
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use the preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found on this runner image."
            exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          echo "Platforms:"; ls "$SDK/platforms" 2>/dev/null || true
          echo "Build tools:"; ls "$SDK/build-tools" 2>/dev/null || true

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            echo "Installing missing platform/build-tools (this is normal on newer images)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::platforms;android-34 is missing and sdkmanager was not found."
              exit 1
            fi
            timeout 300 bash -c "yes | '$SDKMANAGER' --licenses" > /dev/null 2>&1 || true
            timeout 600 "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi

      - name: Install Gradle 8.7
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          java -version
          gradle --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-8.7-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: gradle-8.7-

      # Android updates require the same signing key. A fresh runner would
      # generate a new debug keystore on every run, so it is cached here: as
      # long as this cache survives, a new APK installs over the previous one
      # and keeps the scan history. See android/README.md if it ever expires.
      - name: Keep the signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pinbot-debug-keystore-v1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Collect APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/pin-scanner-${{ github.run_number }}.apk"

      # Uploaded before the tests run, so an installable APK is available even
      # if the validator tests catch a regression.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pin-scanner-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Unit tests (layout validator)
        run: gradle testDebugUnitTest --no-daemon --console=plain --stacktrace
